# Deploys the static demo in studio/ to GitHub Pages.
#
# Pages on a free account requires a public repository; the workflow uploads only
# the studio folder, so the site root is the demo itself and every asset path in
# index.html stays relative.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the engine bundle
        working-directory: engine
        run: |
          npm ci
          npm run build
      - name: Sync the fresh bundle into the demo
        run: node scripts/build-demo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio
      - id: deployment
        uses: actions/deploy-pages@v4
